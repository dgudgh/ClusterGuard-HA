apiVersion: v1
kind: Service
metadata:
  name: mysql-writer
  namespace: database
spec:
  # Deliberately selectorless. ClusterGuard is the only writer endpoint owner.
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mysql-writer-clusterguard
  namespace: database
  labels:
    kubernetes.io/service-name: mysql-writer
    endpointslice.kubernetes.io/managed-by: clusterguard.io/ha
addressType: IPv4
ports:
  - name: mysql
    protocol: TCP
    port: 3306
endpoints: []
