<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClusterGuard HA Console</title>
  <style>
    :root {
      color-scheme:light;
      --ink:#17221d;
      --muted:#64716b;
      --line:#d8e1dc;
      --line-strong:#bdcbc4;
      --canvas:#f4f7f5;
      --panel:#ffffff;
      --rail:#102019;
      --accent:#087a68;
      --accent-soft:#e9f5f1;
      --primary-soft:#edf8f4;
      --candidate-soft:#eef5fb;
      --candidate-line:#9dc3df;
      --danger:#a33d3d;
      --shadow:0 8px 24px rgba(24,49,38,.06);
    }
    * { box-sizing:border-box; }
    html { min-width:320px; background:var(--canvas); }
    body {
      margin:0;
      background:var(--canvas);
      color:var(--ink);
      font:14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font:inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline:3px solid rgba(8,122,104,.24);
      outline-offset:2px;
    }
    .shell { display:grid; min-height:100vh; grid-template-columns:220px minmax(0,1fr); }
    .sidebar {
      display:flex;
      flex-direction:column;
      min-height:100vh;
      padding:24px 16px;
      background:var(--rail);
      color:#edf5f1;
    }
    .brand { display:flex; align-items:center; gap:11px; margin-bottom:32px; }
    .brand-mark {
      display:grid;
      width:38px;
      height:38px;
      place-items:center;
      border-radius:8px;
      background:#f0f7f3;
      color:#102019;
      font-weight:800;
    }
    .brand-name { font-size:16px; font-weight:750; }
    .brand-subtitle { color:#9fb1a8; font-size:12px; }
    nav { display:grid; gap:5px; }
    nav a {
      display:flex;
      min-height:40px;
      align-items:center;
      padding:0 12px;
      border-radius:6px;
      color:#bdcbc4;
      text-decoration:none;
    }
    nav a[aria-current="page"] { background:rgba(255,255,255,.11); color:#fff; }
    .scope-note {
      margin-top:auto;
      padding:13px;
      border:1px solid rgba(236,245,240,.16);
      border-radius:7px;
      color:#9fb1a8;
      font-size:12px;
    }
    main { min-width:0; }
    .page-header {
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:24px;
      padding:26px 32px 22px;
      border-bottom:1px solid var(--line);
      background:var(--panel);
    }
    .eyebrow { margin:0 0 4px; color:var(--accent); font-size:12px; font-weight:750; }
    h1 { margin:0; font-size:24px; letter-spacing:0; }
    .heading-note { margin:5px 0 0; color:var(--muted); }
    .cluster-controls { display:flex; align-items:end; gap:10px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; font-weight:700; }
    select, input, button {
      height:38px;
      border:1px solid var(--line-strong);
      border-radius:7px;
      background:#fff;
      color:var(--ink);
    }
    select { width:min(360px,36vw); padding:0 34px 0 11px; }
    input { width:160px; padding:0 11px; }
    button { display:inline-flex; align-items:center; gap:7px; padding:0 14px; cursor:pointer; font-weight:700; }
    button:hover { border-color:var(--accent); color:var(--accent); }
    button:disabled { cursor:wait; opacity:.62; }
    .content { width:min(1480px,100%); margin:0 auto; padding:22px 32px 42px; }
    .status-strip {
      display:grid;
      grid-template-columns:1.25fr repeat(5,minmax(0,1fr));
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }
    .status-item { min-width:0; min-height:72px; padding:13px 15px; border-right:1px solid var(--line); }
    .status-item:last-child { border-right:0; }
    .status-label { display:block; color:var(--muted); font-size:12px; font-weight:650; }
    .status-value { display:block; margin-top:4px; overflow-wrap:anywhere; font-size:16px; font-weight:760; }
    .topology-band { margin-top:18px; padding:20px 0 6px; background:var(--panel); box-shadow:var(--shadow); }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 20px 16px; border-bottom:1px solid var(--line); }
    h2 { margin:0; font-size:17px; }
    .panel-caption { margin-top:3px; color:var(--muted); font-size:12px; }
    .vip-row {
      display:flex;
      align-items:center;
      gap:8px;
      min-height:30px;
      padding:0 10px;
      border:1px solid #c7d8d0;
      border-radius:999px;
      background:var(--accent-soft);
      color:#176c5d;
      font-size:12px;
      font-weight:750;
    }
    .vip-row[hidden] { display:none; }
    .topology-surface { min-height:200px; padding:34px 20px 38px; }
    .topology-grid {
      display:grid;
      grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);
      width:100%;
      align-items:stretch;
    }
    .primary-column { display:flex; min-width:0; align-items:center; justify-content:center; }
    .replica-list { display:grid; min-width:0; gap:12px; align-content:center; }
    .node-card {
      position:relative;
      display:flex;
      width:100%;
      min-height:84px;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:13px 44px 13px 16px;
      border:1px solid var(--line-strong);
      border-radius:8px;
      background:#fff;
      text-align:center;
      box-shadow:0 7px 20px rgba(34,57,47,.045);
    }
    .primary-column .node-card { background:var(--primary-soft); border-color:#9fd2c3; }
    .node-card.candidate { background:var(--candidate-soft); border-color:var(--candidate-line); }
    .node-role {
      position:absolute;
      top:10px;
      right:10px;
      display:inline-flex;
      align-items:center;
      min-height:22px;
      padding:0 7px;
      border-radius:999px;
      background:#edf3ef;
      color:#496158;
      font-size:11px;
      font-weight:750;
    }
    .candidate .node-role { background:#dbeaf6; color:#245f86; }
    .node-line { width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .node-address { font-size:14px; font-weight:780; }
    .node-detail { margin-top:6px; color:var(--muted); font-size:12px; font-weight:600; }
    .connector { position:relative; min-height:84px; }
    .connector::before {
      position:absolute;
      top:50%;
      left:0;
      width:100%;
      height:1px;
      background:var(--line-strong);
      content:"";
    }
    .connector::after {
      position:absolute;
      top:42px;
      bottom:42px;
      left:50%;
      width:1px;
      background:var(--line-strong);
      content:"";
    }
    .replica-row { position:relative; min-width:0; }
    .replica-row::before {
      position:absolute;
      top:50%;
      right:100%;
      width:36px;
      height:1px;
      background:var(--line-strong);
      content:"";
    }
    .topology-grid.no-primary .replica-row::before { display:none; }
    .empty-node {
      display:grid;
      min-height:84px;
      place-items:center;
      border:1px dashed var(--line-strong);
      border-radius:8px;
      color:var(--muted);
      text-align:center;
    }
    .live-status { margin:16px 20px 0; padding:11px 13px; border-left:3px solid #9cafa4; color:var(--muted); background:#f7faf8; }
    .live-status.error { border-color:var(--danger); color:var(--danger); }
    @media (max-width:1100px) {
      .status-strip { grid-template-columns:repeat(3,1fr); }
      .status-item:nth-child(3) { border-right:0; }
      .status-item:nth-child(n+4) { border-top:1px solid var(--line); }
    }
    @media (max-width:900px) {
      .shell { grid-template-columns:1fr; }
      .sidebar { display:none; }
      .page-header { align-items:stretch; padding:22px 20px 18px; }
      .content { padding:18px 20px 34px; }
      .topology-grid { grid-template-columns:1fr; gap:12px; }
      .connector { display:none; }
      .replica-row::before { display:none; }
      .primary-column .node-card { width:100%; }
    }
    @media (max-width:680px) {
      .page-header { display:block; }
      .cluster-controls { display:grid; grid-template-columns:minmax(0,1fr) auto; margin-top:16px; }
      .cluster-controls label:first-child { grid-column:1 / -1; }
      input { width:100%; }
      select { width:100%; }
      .status-strip { grid-template-columns:repeat(2,1fr); }
      .status-item:nth-child(3) { border-right:1px solid var(--line); }
      .status-item:nth-child(even) { border-right:0; }
      .status-item:nth-child(n+3) { border-top:1px solid var(--line); }
      .panel-heading { align-items:flex-start; }
      .topology-surface { min-height:0; padding:24px 14px 28px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">CG</div>
        <div><div class="brand-name">ClusterGuard HA</div><div class="brand-subtitle">Multi-DB HA Control</div></div>
      </div>
      <nav aria-label="主导航">
        <a href="#topology" aria-current="page">集群拓扑</a>
        <a href="#status-strip">健康摘要</a>
      </nav>
      <div class="scope-note">当前视图只提供发现、健康、候选评估与指标读取。数据库角色保持不变。</div>
    </aside>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">多数据库高可用控制平台</p>
          <h1>ClusterGuard HA Console</h1>
          <p class="heading-note">Multi-DB HA Control · 当前提供 MySQL 只读拓扑与候选评估。</p>
        </div>
        <div class="cluster-controls">
          <label for="cluster-select">数据库集群
            <select id="cluster-select" aria-label="选择数据库集群">
              <option value="">未发现已注册集群</option>
            </select>
          </label>
          <label for="control-token">控制令牌
            <input id="control-token" type="password" autocomplete="off" placeholder="仅用于刷新">
          </label>
          <button id="refresh-topology" type="button" aria-label="刷新所选集群拓扑">↻ 刷新拓扑</button>
        </div>
      </header>
      <div class="content">
        <section class="status-strip" id="status-strip" aria-label="集群状态摘要">
          <div class="status-item"><span class="status-label">集群</span><strong class="status-value" id="summary-cluster">-</strong></div>
          <div class="status-item"><span class="status-label">健康</span><strong class="status-value" id="summary-health">未知</strong></div>
          <div class="status-item"><span class="status-label">主库</span><strong class="status-value" id="summary-primary">-</strong></div>
          <div class="status-item"><span class="status-label">实例</span><strong class="status-value" id="summary-instances">0</strong></div>
          <div class="status-item"><span class="status-label">最大延迟</span><strong class="status-value" id="summary-lag">-</strong></div>
          <div class="status-item"><span class="status-label">QPS</span><strong class="status-value" id="summary-qps">-</strong></div>
        </section>

        <section class="topology-band" id="topology" aria-labelledby="topology-heading">
          <div class="panel-heading">
            <div><h2 id="topology-heading">复制拓扑</h2><div class="panel-caption" id="observed-at">等待拓扑数据</div></div>
            <div class="vip-row" id="vip-row" hidden><span>VIP</span><span id="vip-value">-</span></div>
          </div>
          <div class="topology-surface">
            <div class="topology-grid" id="topology-grid">
              <div class="primary-column" id="primary-column"><div class="empty-node">尚未发现主库</div></div>
              <div class="connector" id="connector" aria-hidden="true"></div>
              <div class="replica-list" id="replica-list"><div class="empty-node">尚未发现从库</div></div>
            </div>
          </div>
          <div class="live-status" id="live-status" role="status" aria-live="polite">正在连接控制 API。</div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const byId = id => document.getElementById(id);
    const state = { clusters: [], selectedClusterId: '', requestGeneration: 0 };

    class APIError extends Error {
      constructor(message, status = 0) {
        super(message);
        this.name = 'APIError';
        this.status = status;
      }
    }

    const noEvidenceMessages = new Set([
      'cluster has no persisted topology observation',
      'candidate evaluation requires persisted probe evidence',
      'candidate evaluation requires exactly one current primary'
    ]);

    const setLiveStatus = (message, isError = false) => {
      const status = byId('live-status');
      status.textContent = message;
      status.className = isError ? 'live-status error' : 'live-status';
    };

    const commitIfCurrent = (generation, commit) => {
      if (generation !== state.requestGeneration) return false;
      commit();
      return true;
    };

    const fetchResult = async (path, options = {}) => {
      let response;
      try {
        response = await fetch(path, options);
      } catch (_) {
        throw new APIError('无法连接控制 API');
      }
      let payload;
      try {
        payload = await response.json();
      } catch (_) {
        throw new APIError('控制 API 返回了无效数据', response.status);
      }
      if (!response.ok || payload.status === 'error') {
        throw new APIError(payload.message || '控制 API 请求失败', response.status);
      }
      return payload.result;
    };

    const evidenceResult = async (path, fallback, section) => {
      try {
        return { value: await fetchResult(path), unavailable: '' };
      } catch (error) {
        if (error instanceof APIError && error.status === 409 && noEvidenceMessages.has(error.message)) {
          return { value: fallback, unavailable: section };
        }
        throw error;
      }
    };

    const endpointText = instance => {
      const hostname = instance.hostname || instance.display_name || '-';
      const ip = instance.ip_address || '-';
      const port = instance.port || '-';
      return `${hostname} · IP ${ip} · 端口 ${port}`;
    };

    const lagText = instance => {
      if (instance.role === 'primary') return '-';
      const lag = instance.replication && instance.replication.lag_seconds;
      return Number.isFinite(lag) ? `${lag}s` : '未知';
    };

    const healthText = value => ({
      healthy: '健康',
      degraded: '降级',
      unhealthy: '异常',
      unknown: '未知'
    })[value] || '未知';

    const versionText = instance => {
      const metadata = instance.engine_metadata || {};
      return metadata.version || '版本未知';
    };

    const roleText = (instance, assessment) => {
      if (instance.role === 'primary') return '主库';
      if (assessment && assessment.eligible && assessment.rank === 1) return '候选节点';
      return '从库';
    };

    const createNodeCard = (instance, assessment) => {
      const role = roleText(instance, assessment);
      const card = document.createElement('article');
      const candidate = role === '候选节点';
      card.className = candidate ? 'node-card candidate' : 'node-card';
      card.setAttribute('aria-label', `${role} ${endpointText(instance)}`);
      card.title = instance.resource_id || '';

      const roleBadge = document.createElement('span');
      roleBadge.className = 'node-role';
      roleBadge.textContent = role;

      const address = document.createElement('div');
      address.className = 'node-line node-address';
      address.textContent = endpointText(instance);

      const detail = document.createElement('div');
      detail.className = 'node-line node-detail';
      detail.textContent = `${versionText(instance)} · ${role} · 延迟 ${lagText(instance)}`;

      card.append(roleBadge, address, detail);
      return card;
    };

    const renderTopology = (snapshot, candidates) => {
      const instances = snapshot ? snapshot.instances || [] : [];
      const assessments = new Map((candidates || []).map(item => [item.instance_id, item]));
      const primary = instances.find(instance => instance.role === 'primary');
      const replicas = instances.filter(instance => instance.role !== 'primary');
      const primaryColumn = byId('primary-column');
      const replicaList = byId('replica-list');
      primaryColumn.replaceChildren();
      replicaList.replaceChildren();

      if (primary) {
        primaryColumn.append(createNodeCard(primary, assessments.get(primary.resource_id)));
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty-node';
        empty.textContent = '尚未发现主库';
        primaryColumn.append(empty);
      }

      if (replicas.length) {
        replicas.forEach(instance => {
          const row = document.createElement('div');
          row.className = 'replica-row';
          row.append(createNodeCard(instance, assessments.get(instance.resource_id)));
          replicaList.append(row);
        });
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty-node';
        empty.textContent = '尚未发现从库';
        replicaList.append(empty);
      }
      byId('topology-grid').classList.toggle('no-primary', !primary);
      byId('connector').hidden = !primary || replicas.length === 0;
      return { instances, primary };
    };

    const activeVIP = endpoints => (endpoints || []).find(endpoint => endpoint.active && endpoint.kind === 'vip');

    const renderVIP = endpoints => {
      const vipEndpoint = activeVIP(endpoints);
      const vipRow = byId('vip-row');
      vipRow.hidden = !vipEndpoint;
      if (!vipEndpoint) {
        byId('vip-value').textContent = '-';
        return;
      }
      const address = vipEndpoint.ip_address || vipEndpoint.hostname || '-';
      byId('vip-value').textContent = vipEndpoint.port ? `${address}:${vipEndpoint.port}` : address;
    };

    const clearClusterView = () => {
      byId('summary-cluster').textContent = '-';
      byId('summary-health').textContent = '未知';
      byId('summary-primary').textContent = '-';
      byId('summary-instances').textContent = '0';
      byId('summary-lag').textContent = '-';
      byId('summary-qps').textContent = '-';
      byId('observed-at').textContent = '等待拓扑数据';
      renderTopology(null, []);
      renderVIP([]);
    };

    const beginClusterRequest = clusterId => {
      const generation = ++state.requestGeneration;
      state.selectedClusterId = clusterId;
      clearClusterView();
      return generation;
    };

    const renderSummary = (clusterDetail, topology, health, metrics) => {
      const cluster = clusterDetail.cluster;
      const instances = topology ? topology.instances || [] : [];
      const primary = instances.find(instance => instance.role === 'primary');
      const lags = instances
        .map(instance => instance.replication && instance.replication.lag_seconds)
        .filter(value => Number.isFinite(value));
      const metricInstances = metrics && metrics.instances ? metrics.instances : [];
      const qpsSamples = metricInstances
        .map(item => item.values && item.values.qps)
        .filter(value => Number.isFinite(value));
      const qps = qpsSamples.reduce((total, value) => total + value, 0);
      byId('summary-cluster').textContent = cluster.display_name || cluster.resource_id;
      byId('summary-health').textContent = health ? healthText(health.health.state) : '未采集';
      byId('summary-primary').textContent = primary ? `${primary.hostname || primary.ip_address}:${primary.port}` : '-';
      byId('summary-instances').textContent = String(instances.length);
      byId('summary-lag').textContent = lags.length ? `${Math.max(...lags)}s` : '-';
      byId('summary-qps').textContent = qpsSamples.length ? qps.toFixed(1) : '-';
      byId('observed-at').textContent = topology && topology.observed_at ? `采集时间 ${new Date(topology.observed_at).toLocaleString('zh-CN')}` : '尚未采集拓扑';
    };

    const loadSelectedCluster = async () => {
      const clusterId = byId('cluster-select').value;
      const generation = beginClusterRequest(clusterId);
      if (!clusterId) {
        commitIfCurrent(generation, () => setLiveStatus('请选择已注册的数据库集群。'));
        return;
      }
      commitIfCurrent(generation, () => setLiveStatus('正在读取所选集群。'));
      try {
        let loaded;
        for (let attempt = 0; attempt < 2; attempt += 1) {
          try {
            const clusterDetail = await fetchResult(`/api/v1/clusters/${clusterId}`);
            const topologySection = await evidenceResult(`/api/v1/clusters/${clusterId}/topology`, null, '拓扑');
            const topology = topologySection.value;
            if (!topology) {
              loaded = {
                clusterDetail,
                topology: null,
                health: null,
                candidates: [],
                metrics: { instances: [] },
                unavailableSections: [topologySection.unavailable, '健康状态', '候选评估', '性能指标'].filter(Boolean)
              };
              break;
            }
            if (!topology.observed_at) throw new APIError('拓扑响应缺少采集标识');
            const observationQuery = `observation_id=${encodeURIComponent(topology.observed_at)}`;
            const [healthSection, candidateSection, metricsSection] = await Promise.all([
              evidenceResult(`/api/v1/clusters/${clusterId}/health?${observationQuery}`, null, '健康状态'),
              evidenceResult(`/api/v1/clusters/${clusterId}/candidates?${observationQuery}`, [], '候选评估'),
              evidenceResult(`/api/v1/clusters/${clusterId}/metrics?${observationQuery}`, { instances: [] }, '性能指标')
            ]);
            loaded = {
              clusterDetail,
              topology,
              health: healthSection.value,
              candidates: candidateSection.value,
              metrics: metricsSection.value,
              unavailableSections: [healthSection, candidateSection, metricsSection]
                .map(section => section.unavailable)
                .filter(Boolean)
            };
            break;
          } catch (error) {
            if (generation !== state.requestGeneration) return;
            if (error instanceof APIError && error.status === 409 && error.message === 'topology observation changed' && attempt === 0) {
              continue;
            }
            throw error;
          }
        }
        if (!loaded) throw new APIError('无法读取一致的拓扑快照');
        const unavailableSections = loaded.unavailableSections;
        commitIfCurrent(generation, () => {
          renderTopology(loaded.topology, loaded.candidates);
          renderVIP(loaded.clusterDetail.endpoints || []);
          renderSummary(loaded.clusterDetail, loaded.topology, loaded.health, loaded.metrics);
          if (unavailableSections.length) {
            setLiveStatus(`部分数据不可用：${unavailableSections.join('、')}。`);
          } else {
            setLiveStatus('拓扑状态已更新。');
          }
        });
      } catch (error) {
        commitIfCurrent(generation, () => {
          clearClusterView();
          setLiveStatus(error.message, true);
        });
      }
    };

    const loadClusters = async () => {
      try {
        const clusters = await fetchResult('/api/v1/clusters');
        state.clusters = clusters || [];
        const selector = byId('cluster-select');
        const previous = selector.value;
        selector.replaceChildren();
        if (!state.clusters.length) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = '未发现已注册集群';
          selector.append(option);
        } else {
          state.clusters.forEach(cluster => {
            const option = document.createElement('option');
            option.value = cluster.resource_id;
            option.textContent = cluster.display_name || cluster.resource_id;
            selector.append(option);
          });
          selector.value = state.clusters.some(cluster => cluster.resource_id === previous) ? previous : state.clusters[0].resource_id;
        }
        await loadSelectedCluster();
      } catch (error) {
        setLiveStatus(error.message, true);
      }
    };

    const refreshTopology = async () => {
      const clusterId = byId('cluster-select').value;
      if (!clusterId) {
        setLiveStatus('请先选择数据库集群。', true);
        return;
      }
      const controlToken = byId('control-token').value.trim();
      if (!controlToken) {
        setLiveStatus('请输入控制令牌后刷新。', true);
        byId('control-token').focus();
        return;
      }
      const generation = ++state.requestGeneration;
      const refresh = byId('refresh-topology');
      refresh.disabled = true;
      commitIfCurrent(generation, () => setLiveStatus('正在刷新拓扑。'));
      try {
        await fetchResult(`/api/v1/clusters/${clusterId}/discover`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${controlToken}` },
          body: '{}'
        });
        if (generation === state.requestGeneration) await loadSelectedCluster();
      } catch (error) {
        if (error instanceof APIError && error.status === 401) byId('control-token').value = '';
        commitIfCurrent(generation, () => setLiveStatus(error.message, true));
      } finally {
        refresh.disabled = false;
      }
    };

    byId('cluster-select').addEventListener('change', loadSelectedCluster);
    byId('refresh-topology').addEventListener('click', refreshTopology);
    loadClusters();
  </script>
</body>
</html>
